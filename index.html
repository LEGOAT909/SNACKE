<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>SNAKE : RISQUE MAXIMUM</title>
    <style>
        body {
            background-color: black;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 0;
            padding: 20px;
            overflow: hidden;
        }
        h1 {
            color: #ff3333;
            margin-bottom: 5px;
            font-size: 28px;
            letter-spacing: 2px;
        }
        #score-container {
            font-size: 20px;
            color: #33ff33;
            margin-bottom: 15px;
        }
        /* Zone de jeu avec les bords rouges "Risque Maximum" */
        #gameCanvas {
            border: 4px solid #ff0000;
            background-color: #050505;
            box-shadow: 0px 0px 20px #ff0000;
            display: block;
            margin: 0 auto;
            cursor: crosshair;
        }
        #instructions {
            margin-top: 15px;
            font-size: 16px;
            color: #aaaaaa;
        }
    </style>
</head>
<body>

    <h1>Δ0 SNAKE : RISQUE MAXIMUM 0Δ</h1>
    <div id="score-container">SCORE : <span id="score">0</span></div>

    <canvas id="gameCanvas" width="400" height="400"></canvas>

    <div id="instructions">
        Clique n'importe où sur le carré pour démarrer.<br>
        Guidez le serpent en déplaçant la souris à l'intérieur de la zone.
    </div>

    <script>
        // --- CONFIGURATION ET VARIABLES (Style ES5 pour MAG 322) ---
        var canvas = document.getElementById("gameCanvas");
        var ctx = canvas.getContext("2d");
        var scoreDisplay = document.getElementById("score");

        var gridSize = 20; // Taille d'un bloc (serpent et pomme)
        var snake = [];
        var apple = { x: 0, y: 0 };
        var score = 0;
        var currentSpeed = 150; // Vitesse de départ (en millisecondes)
        var gameInterval = null;
        var gameStarted = false;

        // Direction cible dictée par la souris relative à la tête du serpent
        var nextDirection = "RIGHT"; 
        var currentDirection = "RIGHT";

        // Initialisation de la position de départ
        function initGame() {
            snake = [
                { x: 160, y: 200 },
                { x: 140, y: 200 },
                { x: 120, y: 200 }
            ];
            score = 0;
            currentSpeed = 150;
            nextDirection = "RIGHT";
            currentDirection = "RIGHT";
            scoreDisplay.innerHTML = score;
            spawnApple();
            draw();
        }

        // Placer une pomme au hasard sur la grille
        function spawnApple() {
            apple.x = Math.floor(Math.random() * (canvas.width / gridSize)) * gridSize;
            apple.y = Math.floor(Math.random() * (canvas.height / gridSize)) * gridSize;
        }

        // --- GESTION DES ÉVÉNEMENTS SOURIS ---
        
        // Clic pour démarrer ou redémarrer
        canvas.addEventListener("click", function() {
            if (!gameStarted) {
                initGame();
                gameStarted = true;
                // Utilisation de setInterval à la place de requestAnimationFrame pour le MAG 322
                gameInterval = setInterval(gameLoop, currentSpeed);
            }
        });

        // Suivi des mouvements du pointeur pour changer la direction
        canvas.addEventListener("mousemove", function(event) {
            if (!gameStarted || snake.length === 0) return;

            // Récupérer la position exacte de la souris dans le canvas
            var rect = canvas.getBoundingClientRect();
            var mouseX = event.clientX - rect.left;
            var mouseY = event.clientY - rect.top;

            var head = snake[0];

            // Calcul de la différence entre la souris et la tête du serpent
            var diffX = mouseX - (head.x + gridSize / 2);
            var diffY = mouseY - (head.y + gridSize / 2);

            // Détermination de la direction principale (Axe X ou Axe Y)
            if (Math.abs(diffX) > Math.abs(diffY)) {
                if (diffX > 0 && currentDirection !== "LEFT") {
                    nextDirection = "RIGHT";
                } else if (diffX < 0 && currentDirection !== "RIGHT") {
                    nextDirection = "LEFT";
                }
            } else {
                if (diffY > 0 && currentDirection !== "UP") {
                    nextDirection = "DOWN";
                } else if (diffY < 0 && currentDirection !== "DOWN") {
                    nextDirection = "UP";
                }
            }
        });

        // --- BOUCLE DE JEU PRINCIPALE ---
        function gameLoop() {
            update();
            draw();
        }

        // Mise à jour des positions et logique des collisions
        function update() {
            currentDirection = nextDirection;
            
            // Calculer la nouvelle position de la tête
            var headX = snake[0].x;
            var headY = snake[0].y;

            if (currentDirection === "RIGHT") headX += gridSize;
            else if (currentDirection === "LEFT") headX -= gridSize;
            else if (currentDirection === "UP") headY -= gridSize;
            else if (currentDirection === "DOWN") headY += gridSize;

            // 1. CONDITION DE MORT : Choc contre les bords rouges
            if (headX < 0 || headX >= canvas.width || headY < 0 || headY >= canvas.height) {
                gameOver();
                return;
            }

            var newHead = { x: headX, y: headY };

            // 2. CONDITION DE MORT : Le serpent se mord la queue
            for (var i = 0; i < snake.length; i++) {
                if (snake[i].x === newHead.x && snake[i].y === newHead.y) {
                    gameOver();
                    return;
                }
            }

            // Ajouter la nouvelle tête au début du corps
            snake.unshift(newHead);

            // Est-ce qu'on mange la pomme ?
            if (newHead.x === apple.x && newHead.y === apple.y) {
                score += 10;
                scoreDisplay.innerHTML = score;
                spawnApple();
                
                // EFFET RISQUE MAXIMUM : Le jeu accélère à chaque pomme mangée (vitesse max limitée à 40ms)
                if (currentSpeed > 40) {
                    clearInterval(gameInterval);
                    currentSpeed -= 5; 
                    gameInterval = setInterval(gameLoop, currentSpeed);
                }
            } else {
                // Si on ne mange pas, on retire le dernier morceau de la queue pour avancer
                snake.pop();
            }
        }

        // Dessiner les éléments sur l'écran
        function draw() {
            // Effacer l'écran
            ctx.fillStyle = "#050505";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Dessiner la pomme (Carré rouge vif)
            ctx.fillStyle = "#ff3333";
            ctx.fillRect(apple.x, apple.y, gridSize, gridSize);

            // Dessiner le serpent (Vert fluo)
            for (var i = 0; i < snake.length; i++) {
                // La tête est légèrement plus claire que le corps
                ctx.fillStyle = (i === 0) ? "#66ff66" : "#00cc00";
                ctx.fillRect(snake[i].x, snake[i].y, gridSize - 2, gridSize - 2); // Le -2 laisse un petit espace esthétique
            }
        }

        // Fin de la partie
        function gameOver() {
            clearInterval(gameInterval);
            gameStarted = false;
            
            // Message de Game Over directement dessiné sur le Canvas
            ctx.fillStyle = "rgba(0, 0, 0, 0.75)";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            ctx.fillStyle = "#ff3333";
            ctx.font = "bold 30px Arial";
            ctx.textAlign = "center";
            ctx.fillText("GAME OVER", canvas.width / 2, canvas.height / 2 - 10);
            
            ctx.fillStyle = "#ffffff";
            ctx.font = "16px Arial";
            ctx.fillText("Cliquez ici pour rejouer", canvas.width / 2, canvas.height / 2 + 30);
        }

        // Premier affichage au chargement de la page
        initGame();
    </script>
</body>
</html>
